[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonicmae"
version = "0.1.0"
description = "Contrastive masked audio learning for industrial anomaly detection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "PyYAML>=6.0"]

[project.scripts]
sonicmae-train = "sonicmae.train:main"
sonicmae-score = "sonicmae.infer:main"

[tool.setuptools.packages.find]
where = ["src"]
